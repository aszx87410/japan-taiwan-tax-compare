<body class="bg-gray-50 text-gray-900">
    <main class="app-shell">
        <h1 class="app-title" data-i18n="main.title">台日税務比較計算機</h1>
        <p class="app-summary" data-i18n="meta.summary">2026年時点で確認できる公的資料をもとに、台湾と日本の給与所得の手取りを概算します。台湾の所得税・健康保険・労工保険・就業保険、日本の所得税・東京都住民税・健康保険・厚生年金・雇用保険を含みます。</p>

        <nav class="language-switcher-wrap" aria-label="Language selector">
            <div class="language-switcher">
                <a class="lang-btn" href="index.html" hreflang="zh-TW" data-lang="zh-TW">
                    中文
                </a>
                <a class="lang-btn active" href="ja.html" hreflang="ja" data-lang="ja">
                    日本語
                </a>
                <a class="lang-btn" href="en.html" hreflang="en" data-lang="en">
                    English
                </a>
            </div>
        </nav>

        <div class="exchange-rate">
            <span id="exchange-rate-display" data-i18n="main.loading_rate">
                為替レート読み込み中...
            </span>
        </div>

        <section class="input-section panel">
            <div class="income-grid">
                <div class="input-group">
                    <label for="twd-income" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="input.twd_income">
                        台湾ドル年収（万元）：
                    </label>
                    <div class="relative">
                        <input type="text"
                               inputmode="decimal"
                               id="twd-income"
                               value="202.00"
                               data-i18n-placeholder="input.twd_placeholder"
                               placeholder="台湾ドル金額を入力してください"
                               class="input-control [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <span class="input-unit" data-i18n="input.twd_unit">万</span>
                    </div>
                </div>
                <div class="input-group">
                    <label for="jpy-income" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="input.jpy_income">
                        日本円年収（万円）：
                    </label>
                    <div class="relative">
                        <input type="text"
                               inputmode="decimal"
                               id="jpy-income"
                               value="1000"
                               data-i18n-placeholder="input.jpy_placeholder"
                               placeholder="日本円金額を入力してください"
                               class="input-control [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none">
                        <span class="input-unit" data-i18n="input.jpy_unit">万</span>
                    </div>
                </div>
            </div>
            <div class="profile-row">
                <div id="profile-label" class="profile-label" data-i18n="profiles.label">
                    世帯条件
                </div>
                <div id="profile-options" class="language-switcher profile-switcher" role="radiogroup" aria-labelledby="profile-label">
                    <button class="lang-btn profile-btn active" type="button" role="radio" aria-checked="true" data-profile-option="single">
                        独身
                    </button>
                    <button class="lang-btn profile-btn" type="button" role="radio" aria-checked="false" data-profile-option="married_no_child">
                        既婚、子どもなし
                    </button>
                    <button class="lang-btn profile-btn" type="button" role="radio" aria-checked="false" data-profile-option="married_one_child_age_3">
                        既婚、子どもあり
                    </button>
                </div>
            </div>
        </section>

        <section id="comparison-table" class="panel comparison-card">
            <h2 class="comparison-title">税務比較</h2>
        </section>

        <section class="results-grid">
            <div class="country-result panel" id="tw-result">
                <div class="result-header">
                    <div class="title-with-action">
                        <h2 class="section-title" data-i18n="results.taiwan_title">台湾税務計算結果</h2>
                        <button class="share-toggle" type="button" data-share-target="taiwan">
                            共有
                        </button>
                    </div>
                    <button class="details-toggle" type="button" data-detail-toggle="taiwan" aria-expanded="false">
                        計算過程を表示
                    </button>
                </div>
                <div class="details text-sm text-gray-600 mb-6"></div>
                <div class="chart-container">
                    <canvas id="tw-chart"></canvas>
                </div>
            </div>
            <div class="country-result panel" id="jp-result">
                <div class="result-header">
                    <div class="title-with-action">
                        <h2 class="section-title" data-i18n="results.japan_title">日本税務計算結果</h2>
                        <button class="share-toggle" type="button" data-share-target="japan">
                            共有
                        </button>
                    </div>
                    <button class="details-toggle" type="button" data-detail-toggle="japan" aria-expanded="false">
                        計算過程を表示
                    </button>
                </div>
                <div class="details text-sm text-gray-600 mb-6"></div>
                <div class="chart-container">
                    <canvas id="jp-chart"></canvas>
                </div>
            </div>
        </section>

        <section id="data-sources" class="panel sources-panel">
            <h2 class="section-title" data-i18n="sources.title">情報源</h2>
            <p class="sources-note" data-i18n="sources.note">データは2026年時点で確認できる公的資料に基づきます。実際の金額は管轄機関および個別の申告条件によって異なります。</p>
            <ul id="sources-list" class="sources-list"></ul>
        </section>
    </main>
    <footer class="text-center p-4">

            <div class="modal-header">

    <div id="share-modal" class="modal-root" hidden>
        <div class="modal-backdrop" data-modal-close></div>
        <section class="modal-panel share-modal-panel" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
            <div class="modal-header">
                <h2 id="share-modal-title" class="modal-title"></h2>
                <button class="modal-close" type="button" data-modal-close aria-label="閉じる">
                    ×
                </button>
            </div>
            <div class="modal-body"></div>
        </section>
    </div>

        window.APP_LOCALE = "ja";
    </script>

</body>
